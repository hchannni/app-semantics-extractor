[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "app-semantics-extractor"
version = "0.1.0"
description = "Public research snapshot for source-grounded Android state extraction"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.58.1",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
]

[project.scripts]
app-semantics-static = "app_semantics_kb.static_analysis.cli.run_android_static_semantics_artifacts:main"
app-semantics-generate = "app_semantics_kb.autoformalization.cli.run_target_pipeline:main"
app-semantics-replay = "app_semantics_kb.autoformalization.cli.run_reproduction_pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app_semantics_kb"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
"src/app_semantics_kb/autoformalization/semantic/__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
